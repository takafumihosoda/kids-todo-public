name: Morning Notice (06:00)

on:
  schedule:
    # - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  send-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Send LINE
        run: |
          curl -X POST https://api.line.me/v2/bot/message/push \
          -H 'Content-Type: application/json' \
          -H "Authorization: Bearer ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}" \
          -d '{
                "to": "${{ secrets.LINE_GROUP_PARENTS }}",
                "messages": [
                  {
                    "type": "text",
                    "text": "🌞【朝の最終確認】今日のToDoを確認しましょう！\n昨日の積み残し分も自動合体しています。チェックして子供たちへ配信してください👇\nhttps://kids-todo-public-jbseharpyqrnsqpdwfneg7.streamlit.app/"
                  }
                ]
              }'
